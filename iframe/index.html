<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 与 Main.less 中 .ajax-modifier-main 的 max-width:800px 一致；勿用 device-width，弹窗内会过窄 -->
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>Ajax Modifier</title>
  <style>
    /**
     * 悬浮 iframe / DevTools panel 共用此页。
     * 宽度与 Main.less 中 max-width:800px 一致；高度交给外层容器（content.js 设 100vh）。
     */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: auto;
    }
    #main {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="main"></div>
  <script type="module" src="dist/bundle.js"></script>
</body>
</html>
